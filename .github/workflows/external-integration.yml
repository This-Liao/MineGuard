name: External Integration

on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * *'

permissions:
  contents: read

concurrency:
  group: external-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integration:
    name: PostgreSQL · Milvus · 跨进程恢复
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MINEGUARD_RUN_EXTERNAL_IT: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 启动本次 runner 的隔离数据库
        run: docker compose -f infra/compose.integration.yml up -d --wait --wait-timeout 300
      - name: 运行外部服务与恢复测试
        run: mvn --batch-mode --no-transfer-progress -Pexternal-it verify
      - name: 保存集成测试报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: external-integration-reports
          path: |
            target/failsafe-reports/
            target/surefire-reports/
            target/site/jacoco/
            data/runtime/distributed-it/**/report.json
            data/runtime/distributed-it/**/node-*.log
          retention-days: 14
          if-no-files-found: warn
      - name: 清理本次临时 runner 的测试容器与卷
        if: always()
        run: docker compose -f infra/compose.integration.yml down --volumes --remove-orphans
